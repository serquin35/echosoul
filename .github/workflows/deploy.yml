name: Unified Deployment (Prebuilt)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter App (Web)
        working-directory: ./echosoul
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "AUTH_REDIRECT_URL=${{ secrets.AUTH_REDIRECT_URL }}" >> .env
          echo "N8N_CHAT_WEBHOOK_URL=${{ secrets.N8N_CHAT_WEBHOOK_URL }}" >> .env
          flutter pub get
          flutter build web --release --base-href "/app/"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Integrate Flutter into Landing
        run: |
          mkdir -p landing/public/app
          cp -r echosoul/build/web/* landing/public/app/

      - name: Build and Package for Vercel
        working-directory: ./landing
        run: |
          # 1. Instalar dependencias necesarias para el build de Vite
          npm install
          
          # 2. Vincular el proyecto (genera .vercel/project.json)
          npx vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}
          
          # 3. Ejecutar el build oficial de Vercel CLI
          # Esto generará automáticamente la carpeta .vercel/output con el config.json correcto (v3)
          # y ejecutará el comando de build configurado (vite build)
          npx vercel build --prod --token ${{ secrets.VERCEL_TOKEN }}
          
          # 4. Desplegar el resultado empaquetado
          npx vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
