name: Unified Deployment (Clean Structure)

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter App (Web)
        working-directory: ./echosoul
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "AUTH_REDIRECT_URL=${{ secrets.AUTH_REDIRECT_URL }}" >> .env
          echo "N8N_CHAT_WEBHOOK_URL=${{ secrets.N8N_CHAT_WEBHOOK_URL }}" >> .env
          flutter clean
          flutter pub get
          flutter build web --release --base-href "/app/"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Landing Page (Vite)
        working-directory: ./landing
        run: |
          npm install
          npm run build

      - name: Assemble Production Bundle (Vercel Build Output API)
        run: |
          # 1. Limpiar y crear estructura de salida de Vercel
          rm -rf .vercel/output
          mkdir -p .vercel/output/static/app
          
          # 2. Copiar Landing Page (Vite output) a la raíz estática
          cp -r landing/dist/* .vercel/output/static/
          
          # 3. Copiar Flutter App (Flutter output) a la subcarpeta /app/
          cp -r echosoul/build/web/* .vercel/output/static/app/
          
          # 4. Configurar el archivo de configuración (Version 3 es obligatoria para --prebuilt)
          echo '{
            "version": 3,
            "cleanUrls": true,
            "trailingSlash": false,
            "rewrites": [
              {
                "source": "/app/:path((?!.*\\.).*)",
                "destination": "/app/index.html"
              }
            ]
          }' > .vercel/output/config.json
          
          echo "🔍 Estructura de despliegue generada:"
          ls -R .vercel/output | grep ":$" | sed -e 's/:$//' -e 's/[^-][^\/]*\//--/g' -e 's/^/   /'

      - name: Deploy to Vercel
        run: |
          npx vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
