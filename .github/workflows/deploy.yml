name: Unified Deployment (Prebuilt)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter App (Web)
        working-directory: ./echosoul
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "AUTH_REDIRECT_URL=${{ secrets.AUTH_REDIRECT_URL }}" >> .env
          echo "N8N_CHAT_WEBHOOK_URL=${{ secrets.N8N_CHAT_WEBHOOK_URL }}" >> .env
          flutter pub get
          flutter build web --release --base-href "/app/"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Integrate Flutter into Landing
        run: |
          mkdir -p landing/public/app
          cp -r echosoul/build/web/* landing/public/app/

      - name: Verify Flutter build was copied correctly
        run: |
          echo "🔍 Verificando que Flutter build está en landing/public/app/..."
          ls -la landing/public/app/index.html || (echo "❌ ERROR: Flutter index.html no encontrado en landing/public/app/" && exit 1)
          ls -la landing/public/app/main.dart.js 2>/dev/null || ls -la landing/public/app/flutter.js 2>/dev/null || echo "⚠️  Nota: Comprobando archivos JS de Flutter..."
          echo "✅ Flutter build verificado correctamente"
          echo "Tamaño de landing/public/app:"
          du -sh landing/public/app/

      - name: Build and Package for Vercel
        working-directory: ./landing
        run: |
          # 1. Instalar dependencias necesarias para el build de Vite
          npm install
          
          # 2. Vincular el proyecto (genera .vercel/project.json)
          # IMPORTANTE: vercel pull descarga la config desde Vercel,
          # pero el vercel.json de la RAÍZ del repo tiene precedencia en producción.
          npx vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}
          
          # 3. Ejecutar el build oficial de Vercel CLI
          npx vercel build --prod --token ${{ secrets.VERCEL_TOKEN }}
          
          # 4. Verificar que /app/index.html existe en el output final (crítico para SPA routing)
          echo "🔍 Verificando estructura de .vercel/output/static:"
          ls -la .vercel/output/static/app/index.html || (echo "❌ ERROR CRÍTICO: /app/index.html no está en el output. Los links de la landing darán 404." && exit 1)
          echo "✅ Output verificado — /app/index.html presente"
          echo "Tamaño total del output:"
          du -sh .vercel/output/static/
          
          # 5. Desplegar el resultado empaquetado
          npx vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
