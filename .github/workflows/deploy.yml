name: Unified Deployment (Clean Structure)

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter App (Web)
        working-directory: ./echosoul
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "AUTH_REDIRECT_URL=${{ secrets.AUTH_REDIRECT_URL }}" >> .env
          echo "N8N_CHAT_WEBHOOK_URL=${{ secrets.N8N_CHAT_WEBHOOK_URL }}" >> .env
          flutter clean
          flutter pub get
          flutter build web --release --base-href "/app/"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Landing Page (Vite)
        working-directory: ./landing
        run: |
          npm install
          npm run build

      - name: Assemble Production Bundle (Build Output API)
        run: |
          mkdir -p .vercel/output/static/app
          # 1. Copiar Landing (Vite)
          cp -r landing/dist/* .vercel/output/static/
          # 2. Copiar App (Flutter)
          cp -r echosoul/build/web/* .vercel/output/static/app/
          # 3. Configuración para Vercel (Build Output API v3)
          # Usamos el patrón estándar: primero intentar archivos físicos, luego reescribir a index.html
          echo '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/app/.*","dest":"/app/index.html"}]}' > .vercel/output/config.json
          
          echo "🔍 Estructura del Build Output API:"
          ls -R .vercel/output | grep ":$" | sed -e 's/:$//' -e 's/[^-][^\/]*\//--/g' -e 's/^/   /'

      - name: Deploy to Vercel
        run: |
          npx vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
