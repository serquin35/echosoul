name: Unified Deployment (Clean Structure)

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter App (Web)
        working-directory: ./echosoul
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "AUTH_REDIRECT_URL=${{ secrets.AUTH_REDIRECT_URL }}" >> .env
          echo "N8N_CHAT_WEBHOOK_URL=${{ secrets.N8N_CHAT_WEBHOOK_URL }}" >> .env
          flutter clean
          flutter pub get
          flutter build web --release --base-href "/app/"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Landing Page (Vite)
        working-directory: ./landing
        run: |
          npm install
          npm run build

      - name: Assemble Production Bundle (Pure Static)
        run: |
          mkdir -p deploy/app
          # 1. Copiar solo el RESULTADO de Vite (no el código fuente ni package.json)
          cp -r landing/dist/* deploy/
          # 2. Copiar el RESULTADO de Flutter
          cp -r echosoul/build/web/* deploy/app/
          # 3. Copiar el vercel.json (Versión 2, la estándar)
          cp vercel.json deploy/
          
          echo "🔍 Estructura de despliegue generada:"
          ls -R deploy | grep ":$" | sed -e 's/:$//' -e 's/[^-][^\/]*\//--/g' -e 's/^/   /'
          
          # Verificar que NO haya package.json en deploy para evitar auto-build de Vercel
          find deploy -name "package.json" -delete

      - name: Deploy to Vercel
        run: |
          npx vercel deploy deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
