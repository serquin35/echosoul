name: Unified Deployment (Clean Structure)

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter App (Web)
        working-directory: ./echosoul
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "AUTH_REDIRECT_URL=${{ secrets.AUTH_REDIRECT_URL }}" >> .env
          echo "N8N_CHAT_WEBHOOK_URL=${{ secrets.N8N_CHAT_WEBHOOK_URL }}" >> .env
          flutter clean
          flutter pub get
          flutter build web --release --base-href "/app/" \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=N8N_CHAT_WEBHOOK_URL="${{ secrets.N8N_CHAT_WEBHOOK_URL }}" \
            --dart-define=AUTH_REDIRECT_URL="${{ secrets.AUTH_REDIRECT_URL }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Landing Page (Vite)
        working-directory: ./landing
        run: |
          npm install
          npm run build

      - name: Assemble Production Bundle (Build Output API)
        run: |
          mkdir -p .vercel/output/static/app
          # 1. Copiar Landing (Vite)
          cp -r landing/dist/* .vercel/output/static/
          # 2. Copiar App (Flutter)
          cp -r echosoul/build/web/* .vercel/output/static/app/
          
          # 3. Configuración para Vercel (Build Output API v3)
          # Usamos cat para evitar problemas de escape y definimos rutas SPA robustas
          cat <<EOF > .vercel/output/config.json
          {
            "version": 3,
            "routes": [
              { "src": "/privacy", "dest": "/privacy.html" },
              { "src": "/terms", "dest": "/terms.html" },
              { "src": "/cookies", "dest": "/cookies.html" },
              { "handle": "filesystem" },
              { "src": "/app/(.*)", "dest": "/app/index.html" },
              { "src": "/((?!app/).*)", "dest": "/index.html" }
            ],
            "overrides": {
              "privacy-en.html": { "path": "privacy-en" },
              "terms-en.html": { "path": "terms-en" },
              "cookies-en.html": { "path": "cookies-en" }
            }
          }
          EOF
          
          # 4. Eliminar vercel.json de la raíz en el paquete de despliegue para evitar conflictos
          # (Solo lo borramos del entorno de ejecución, no del repo)
          rm -f vercel.json
          
          echo "🔍 Estructura del Build Output API generada correctamente."

      - name: Deploy to Vercel
        run: |
          npx vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
