name: echosoul
description: EchoSoul — Proactive AI Companion App
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Supabase (auth + database)
  supabase_flutter: ^2.5.0
  flutter_dotenv: ^5.1.0

  # HTTP client
  dio: ^5.4.3+1

  # Offline cache for chat (NoSQL, fast)
  hive_flutter: ^1.1.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Immutable models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # Utils
  intl: ^0.20.2

  # Profile: image picker + local prefs
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  universal_html: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/

  # fonts:
  #   - family: Inter
